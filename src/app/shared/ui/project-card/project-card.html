@let p = project();
<article class="card glass spotlight" appTilt [tiltMax]="4">
  <div class="card__cover" [style.--c1]="p.colors[0]" [style.--c2]="p.colors[1]" aria-hidden="true">
    <div class="card__window" [class.card__window--shot]="p.image">
      <div class="card__dots"><i></i><i></i><i></i></div>
      @if (p.image) {
        <img class="card__shot" [src]="p.image" [alt]="'Captura de ' + p.name" loading="lazy" decoding="async" />
      } @else {
        <code class="mono">{{ p.glyph }}</code>
        <div class="card__lines"><i></i><i></i><i></i></div>
      }
    </div>
    <div class="card__badge icon-tile">
      <app-icon [name]="p.icon" [size]="24" />
    </div>
  </div>

  <div class="card__body">
    <div class="card__meta">
      <span class="chip">{{ labels[p.category] }}</span>
      <span class="caption">{{ p.year }}</span>
    </div>
    <h3 class="card__title">{{ p.name }}</h3>
    <p class="card__summary">{{ p.summary }}</p>
    <ul class="card__tags" role="list" aria-label="Tecnologías">
      @for (tag of p.tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
    @if (p.demoUrl || p.repoUrl) {
      <div class="card__links">
        @if (p.demoUrl) {
          <a class="card__link card__link--primary" [href]="p.demoUrl" target="_blank" rel="noopener">
            Ver demo <app-icon name="arrow-right" [size]="14" />
          </a>
        }
        @if (p.repoUrl) {
          <a class="card__link" [href]="p.repoUrl" target="_blank" rel="noopener">
            <app-icon name="github" [size]="14" /> Código
          </a>
        }
      </div>
    }
  </div>
</article>
